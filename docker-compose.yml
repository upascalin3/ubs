services:
  postgres:
    image: postgres:16-alpine
    container_name: ubs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wasac_ms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ubs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wasac_ms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ubs_pg_data:
